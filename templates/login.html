<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg">
    <div class="wrapper">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
        <form class="form" action="/login" method="POST">
            <h1 class="headerlink">Log In</h1>
            <div>
                <input type="text" class="input" placeholder="Enter Email" name="email" id="email" required>
                <input type="password" class="input" placeholder="Enter Password" name="password" id="password" required>
                <button type="submit" class="submit">Login</button>
            </div>
            <p class="footerlink">
              New User?
              <a href="{{ url_for('home') }}" id="register">Register</a>
            </p>
            <p class="footerlink">
              Login As a Guest
              <a href="{{ url_for('guest_login') }}" id="guestLogin">GuestLogin</a>
            </p>


        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
